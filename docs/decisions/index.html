<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قرارات تربيطات آيات القرآن</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Amiri:wght@700&family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a quick multiple-choice review for two partners; pictures first, almost no prose.
   IDEA: a framed booklet like the app's Mushaf page; each page = one question, pictures as answers.
   PICTURE: every answer is a picture (real screenshot, logo, or a small drawn sample) with a number and a tick box.
   COLOUR and TYPE: the app's Jasmine Night — deep purple, gold, cream; Cairo text, Amiri titles.
   LAYOUT: one question per slide in a native side scroller; recommendation under the answers; dropdown + «تم» to go on. */
:root{color-scheme:light;--bg:#FFFCF3;--ink:#24053B;--soft:#5E4A6D;--p:#3A065F;--p2:#4C0B7A;--g:#C9A227;--g2:#F0C85A;--card:#fff;--line:#E3DCE8}
:root[data-theme=dark]{color-scheme:dark;--bg:#1a0730;--ink:#F8F1DE;--soft:#C6B9CF;--card:#24053B;--line:#3C2D46}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Cairo,system-ui,sans-serif;overflow-x:clip}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px max(4vw,12px);background:var(--p);color:#F8F1DE;flex-wrap:wrap}
.bar h1{font:700 20px/1.2 Amiri,serif;margin:0;flex:1}
.bar button{min-height:44px;min-width:44px;padding:0 14px;border-radius:12px;border:1px solid var(--g2);background:transparent;color:var(--g2);font:600 15px Cairo;cursor:pointer}
button:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--g2);outline-offset:2px}
.prog{height:4px;background:#ffffff22;flex-basis:100%;border-radius:4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--g2);transition:width .25s}
.deck{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none}
.deck::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;padding:clamp(14px,3vw,36px) max(4vw,12px) 40px}
.frame{max-width:980px;margin:0 auto;background:var(--card);border-radius:24px;padding:clamp(16px,3vw,32px);box-shadow:0 0 0 2px var(--g),0 0 0 7px var(--card),0 0 0 8px var(--g),0 14px 40px rgba(36,5,59,.15)}
.num{display:inline-block;background:var(--p);color:var(--g2);border-radius:999px;padding:2px 14px;font-weight:800;font-size:14px}
.tag{display:inline-block;border-radius:999px;padding:2px 12px;font-size:13px;font-weight:700;margin-inline-start:6px}
.done{background:#e7f6ec;color:#155d33}.open{background:#fff1d6;color:#7a4b00}
h2{font:700 clamp(26px,4vw,38px)/1.15 Amiri,serif;margin:8px 0 4px;color:var(--p);text-wrap:balance}
:root[data-theme=dark] h2{color:var(--g2)}
.q{font-size:18px;color:var(--soft);margin:0 0 14px}
.opts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,145px),1fr))}
.opt{position:relative;display:flex;flex-direction:column;gap:8px;border:2px solid var(--line);border-radius:18px;padding:10px;cursor:pointer;background:var(--bg);font:inherit;color:inherit;text-align:center}
.opt.on{border-color:var(--p2);background:#f3eaff;box-shadow:0 0 0 3px #c29fdd}
:root[data-theme=dark] .opt.on{background:#3a1460}
.pic{height:190px;border-radius:12px;overflow:hidden;display:grid;place-items:center;background:#fff;border:1px solid var(--line);padding:6px}
.pic{position:relative}.pic img{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);object-fit:contain}
.cap{display:flex;align-items:center;gap:8px;justify-content:center;font-weight:800;font-size:16px}
.n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--p);color:var(--g2);font-weight:800;font-size:15px}
.tick{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--g);display:grid;place-items:center;color:#fff;font-weight:900}
.opt.on .tick{background:var(--p2);border-color:var(--p2)}.opt.on .tick::after{content:"✓"}
.mark{position:absolute;top:8px;inset-inline-start:8px;z-index:1;background:var(--g2);color:#24053B;font-size:12px;font-weight:800;border-radius:8px;padding:0 8px}
.rec{margin-top:16px;padding:12px 14px;border-radius:14px;background:#FAF0CF;color:#4F3B12;font-weight:600}
.rec b{color:#24053B}
:root[data-theme=dark] .rec{background:#4F3B12;color:#FAF0CF}:root[data-theme=dark] .rec b{color:#F0C85A}
.go{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.go label{font-weight:800}
select{min-height:48px;font:600 16px Cairo;border-radius:12px;border:2px solid var(--g);padding:0 10px;background:var(--bg);color:var(--ink);flex:1;min-width:170px}
.btn{min-height:48px;padding:0 22px;border-radius:14px;border:0;background:linear-gradient(#F6D980,#D9AE3C);color:#24053B;font:800 17px Cairo;cursor:pointer}
.ok{color:#155d33;font-weight:800}
details{margin-top:10px}summary{cursor:pointer;color:var(--soft);font-size:14px;min-height:32px}
textarea{width:100%;min-height:64px;margin-top:6px;border-radius:12px;border:1px solid var(--line);padding:10px;font:16px Cairo;background:var(--bg);color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{color:var(--soft);font-weight:600;font-size:13px}
td a{color:inherit;font-weight:700}
pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;max-height:340px;overflow:auto;font:14px/1.6 Cairo}
.muted{color:var(--soft);font-size:14px}
.m{font:700 20px/1.9 "Noto Naskh Arabic",serif;padding:4px;color:#24053B}
.w{padding:0 3px;border-radius:6px}.ok-w{color:#4C0B7A}.bad{color:#be123c;background:#ffe4e6}.grey{color:#9ca3af}.hid{background:#ffffe6;color:transparent;border:1px dashed #e5d9a8}.gr{color:#047857}
.chip{display:inline-block;margin:3px;padding:5px 10px;border-radius:10px;font:700 14px Cairo}
.sw{display:flex;gap:6px;justify-content:center}.sw i{width:38px;height:90px;border-radius:10px;display:block}
.phone{width:120px;height:170px;border-radius:18px;border:3px solid #24053B;position:relative;background:#FFFCF3;overflow:hidden}
.phone .isl{position:absolute;top:5px;left:50%;transform:translateX(-50%);width:44px;height:12px;border-radius:8px;background:#24053B}
.phone .b{position:absolute;padding:3px 8px;border-radius:8px;background:#4C0B7A;color:#F0C85A;font:800 11px Cairo}
.phone .pop{position:absolute;left:8px;right:8px;border-radius:8px;background:#fff;border:2px solid #C9A227;font:700 10px Cairo;color:#3A065F;padding:4px}
.phone .ln{position:absolute;left:10px;right:10px;height:6px;border-radius:3px;background:#C6B9CF}
.big{font:800 50px/1 Cairo;color:#4C0B7A;direction:ltr;unicode-bidi:isolate}
.big small{display:block;font-size:14px;color:#5E4A6D;font-weight:600;margin-top:6px}
.shine{width:150px;height:46px;border-radius:12px;background:linear-gradient(110deg,#D9AE3C 30%,#FFF3C4 45%,#D9AE3C 60%);background-size:250% 100%;animation:sh 2.6s linear infinite;display:grid;place-items:center;font:800 15px Cairo;color:#24053B}
@keyframes sh{from{background-position:120% 0}to{background-position:-120% 0}}
@media(max-width:600px){.pic{height:140px}.cap{font-size:14px}.big{font-size:40px}table{font-size:13px}}
@media(prefers-reduced-motion:reduce){.deck{scroll-behavior:auto}.prog i{transition:none}.shine{animation:none}}
</style>
</head>
<body>
<div class="bar">
  <h1>القرارات</h1>
  <button id="prev" aria-label="اللي قبل">→</button>
  <span id="pos" aria-live="polite"></span><span id="sync" class="muted" style="color:#F0C85A"></span>
  <button id="next" aria-label="اللي بعد">←</button>
  <div class="prog"><i id="pg"></i></div>
</div>
<main class="deck" id="deck"></main>
<script>
{
// ---- small drawn samples, for choices that have no screenshot ----
const W=(a)=>`<div class="m">${a.map(([t,c])=>`<span class="w ${c}">${t}</span>`).join(' ')}</div>`;
const SW=(c)=>`<div class="sw">${c.map(x=>`<i style="background:${x}"></i>`).join('')}</div>`;
const PH=(inner)=>`<div class="phone"><span class="isl"></span>${inner}</div>`;
const B=(pos,label)=>`<span class="b" style="${pos}">${label}</span>`;
const BIG=(n,s)=>`<div class="big">${n}<small>${s}</small></div>`;
const CH=(a)=>`<div>${a.map(([t,bg,fg])=>`<span class="chip" style="background:${bg};color:${fg}">${t}</span>`).join('')}</div>`;
const G=(t)=>CH([[t,'#E3B443','#24053B']]), P=(t)=>CH([[t,'#EEE3F6','#3A065F']]);
const I=(f)=>`<img src="img/${f}" alt="">`;
const PAL=(top,btn,acc,bg,txt)=>`<div class="phone" style="background:${bg}"><span class="isl"></span><span style="position:absolute;top:22px;left:0;right:0;height:26px;background:${top}"></span><span style="position:absolute;top:58px;left:10px;right:10px;height:34px;border-radius:8px;background:${btn}"></span><span style="position:absolute;top:100px;left:10px;right:10px;height:26px;border-radius:8px;background:${acc};color:${txt};font:800 11px Cairo;display:grid;place-items:center">ابدأ</span><span style="position:absolute;top:134px;left:10px;width:46px;height:26px;border-radius:8px;background:${btn}"></span><span style="position:absolute;top:134px;right:10px;width:46px;height:26px;border-radius:8px;background:${btn}"></span></div>`;
const LINES=[30,46,62,78,94,110,126,142].map(t=>`<span class="ln" style="top:${t}px"></span>`).join('');
const MIC='<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#4C0B7A" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>';
const SMIC='<svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="#4C0B7A" stroke-width="2" stroke-linecap="round"><rect x="2" y="2" width="14" height="14" rx="3"/><rect x="7" y="5" width="4" height="7" rx="2"/><circle cx="17" cy="17" r="3"/><path d="M19.5 19.5 22 22"/></svg>';
const CD='<svg width="80" height="80" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#E3B443"/><circle cx="12" cy="12" r="7" fill="none" stroke="#fff8"/><circle cx="12" cy="12" r="2.5" fill="#fff"/></svg>';
const HEAD='<svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="#4C0B7A" stroke-width="2"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><rect x="2" y="14" width="5" height="7" rx="2"/><rect x="17" y="14" width="5" height="7" rx="2"/></svg>';
const OK2=[['وَلَقَدْ','ok-w'],['يَسَّرْنَا','ok-w']];
const GOLD='#E3B443',GT='#24053B';

// ---- the decisions. t title, q question, o [label, picture], p Claude's recommendation, s 1 decided / 0 open, r recommendation line.
// shortcut: Claude edits this array as decisions are taken; one file, no build.
const D = [
 {g:'الألوان',t:'ألوان التطبيق',q:'أنهي ألوان؟',o:[['ليل الياسمين',PAL('#3A065F','#4C0B7A','#E3B443','#FFFCF3','#24053B')],['زمردي وذهبي (القديم)',PAL('#064e3b','#047857','#E3B443','#ecfdf5','#064e3b')],['حبر وعنبر',PAL('#1f2a44','#334155','#d97706','#fffbeb','#fff')],['بحر وفضة',PAL('#0c4a6e','#0369a1','#cbd5e1','#f8fafc','#0c4a6e')]],p:0,s:1,r:'ليل الياسمين — مميز، واتطبق على التطبيق كله.'},
 {g:'الألوان',t:'درجة البنفسجي',q:'غامق ولا فاتح؟',o:[['غامق',SW(['#24053B','#3A065F','#4C0B7A'])],['فاتح',SW(['#7F44B0','#A06FC9','#C29FDD'])]],p:0,s:1,r:'غامق.'},
 {g:'الألوان',t:'الصفحات بعد تصليح الألوان',q:'قبل ولا بعد؟',o:[['قبل (مخلوط)',I('landing_old.jpg')],['بعد (بنفسجي وذهبي)',I('landing_new.jpg')]],p:1,s:1,r:'بعد — لون واحد في كل التطبيق.'},
 {g:'الألوان',t:'الزرار الذهبي',q:'أنهي زرار؟',o:[['ذهبي غامق بكلام أبيض',I('gold_old.jpg')],['ذهبي فاتح بكلام غامق',I('gold_new.jpg')]],p:1,s:1,r:'الفاتح — أوضح.'},
 {g:'الألوان',t:'لمعة الزرار الأساسي',q:'يلمع ولا ثابت؟',o:[['لمعة بطيئة بتعدّي','<div class="shine">ابدأ</div>'],['ثابت',G('ابدأ')]],p:0,s:1,r:'يلمع — وتقف لو الموبايل عامل «تقليل الحركة».'},
 {g:'الألوان',t:'لون الكلمة الصح في النتيجة',q:'أنهي لون؟',o:[['بنفسجي',W([...OK2,['الْقُرْآنَ','bad']])],['أخضر',W([['وَلَقَدْ','gr'],['يَسَّرْنَا','gr'],['الْقُرْآنَ','bad']])]],p:0,s:0,r:'بنفسجي — زي باقي التطبيق، والغلط أحمر.'},
 {g:'الشكل',t:'اللوجو',q:'أنهي لوجو؟',o:[['الكتاب المربوط',I('logo_1.png')],['الكتاب بالحلقتين',I('logo_1b.png')],['النجمة والمصحف',I('logo_2.png')],['الصفحة والصوت',I('logo_3.png')],['اللوجو الحالي',I('logo_old.png')]],p:0,s:0,r:'بيقول «تربيطات» من أول نظرة. والحالي يفضل اختيار في الإعدادات.'},
 {g:'الشكل',t:'الاسم على الأيقونة',q:'أنهي اسم؟',o:[['تربيطات آيات القرآن',G('تربيطات آيات القرآن')],['روابط الذكر الحكيم',G('روابط الذكر الحكيم')],['الاتنين',G('تربيطات آيات القرآن')+P('روابط الذكر الحكيم')]],p:0,s:1,r:'تربيطات آيات القرآن.'},
 {g:'الشكل',t:'الصفحة الرئيسية',q:'أنهي رئيسية؟',o:[['القديمة',I('home_old.jpg')],['الجديدة بالإطار',I('home_new.jpg')]],p:1,s:1,r:'الجديدة — إطار ذهبي ونجوم وآية تحت.'},
 {g:'الشكل',t:'لمسة البلاطات',q:'لما تدوس على بلاطة؟',o:[['تموّج + نقرة خفيفة',P('〰 تموّج')+P('🔈 نقرة')],['ولا حاجة',P('—')]],p:0,s:1,r:'تموّج ونقرة — وصوت النقرة يتقفل من الإعدادات.'},
 {g:'الشكل',t:'زرار الرجوع',q:'فين؟',o:[['تحت على الشمال',PH(B('bottom:10px;left:8px','رجوع'))],['فوق',PH(B('top:22px;left:8px','رجوع'))]],p:0,s:1,r:'تحت — جزيرة الآيفون بتغطي اللي فوق.'},
 {g:'الشكل',t:'لوحتي والإدارة',q:'يتفتحوا منين؟',o:[['من الإعدادات',P('الإعدادات ← لوحتي')+P('الإعدادات ← الإدارة')],['من الشريط اللي تحت',G('الرئيسية')+G('لوحتي')+G('الإدارة')+G('المصحف')]],p:0,s:1,r:'من الإعدادات — الشريط يفضل خفيف.'},
 {g:'الشكل',t:'اسم زرار التسميع',q:'تحت «حفظ»؟',o:[['سمّع لي',G('سمّع لي')],['الاختبار',G('الاختبار')]],p:0,s:1,r:'«سمّع لي».'},
 {g:'الشكل',t:'لغة التطبيق',q:'إنجليزي دلوقتي؟',o:[['عربي بس دلوقتي',BIG('ع','الإنجليزي بعدين من الإعدادات')],['عربي + إنجليزي',BIG('ع / E','')]],p:0,s:1,r:'عربي بس دلوقتي.'},
 {g:'الأيقونات',t:'أيقونة المايك',q:'على أنهي زراير؟',o:[['التسميع بس',MIC+P('سمّع لي')],['كل زرار فيه صوت',MIC+P('سمّع لي')+P('استمع')]],p:0,s:1,r:'التسميع بس — و«حفظ» من غير مايك.'},
 {g:'الأيقونات',t:'أيقونة البحث بالصوت',q:'أنهي؟',o:[['مايك في مربع + عدسة',SMIC],['نفس مايك التسميع',MIC]],p:0,s:1,r:'المختلفة.'},
 {g:'الأيقونات',t:'أيقونة الاستماع',q:'أنهي؟',o:[['أسطوانة لامعة بتلف',CD],['سماعة',HEAD]],p:0,s:1,r:'الأسطوانة.'},
 {g:'التسميع',t:'شاشة التسميع',q:'بتسمّع على إيه؟',o:[['صفحة المصحف والكلمات مغطاة',W([...OK2,['الْقُرْآنَ','hid'],['لِلذِّكْرِ','hid']])],['نص عادي',W([['وَلَقَدْ يَسَّرْنَا الْقُرْآنَ لِلذِّكْرِ','']])]],p:0,s:1,r:'صفحة المصحف — كل كلمة تتكشف لما تقولها صح.'},
 {g:'التسميع',t:'لما يغلط',q:'بيحصل إيه؟',o:[['يقف والشيخ يصحح',CH([['⏸ وقف','#ffe4e6','#be123c']])+P('🔊 الشيخ يصحح')],['يكمّل ويتعلّم في الآخر',P('▶ يكمّل')]],p:0,s:1,r:'يقف والشيخ يصحح.'},
 {g:'التسميع',t:'الكلمة اللي ما اتسمعتش كويس',q:'دوشة أو كحة؟',o:[['رمادي — مش غلط',W([...OK2,['الْقُرْآنَ','grey']])],['أحمر — غلط',W([...OK2,['الْقُرْآنَ','bad']])]],p:0,s:1,r:'رمادي.'},
 {g:'التسميع',t:'الحرف القريب (غ/خ، ز/ذ…)',q:'لو قال حرف قريب؟',o:[['رمادي دايمًا',W([['سمعت غين مكان الخاء','grey']])],['رمادي بس لو الصوت مش واضح',W([['غلط','bad'],['أو','ok-w'],['رمادي','grey']])],['غلط',W([['غلط','bad']])]],p:0,s:1,r:'رمادي دايمًا — ويظهر السبب، والمستخدم ما يخرجش زعلان.'},
 {g:'التسميع',t:'الرمادي والدرجة',q:'يخصم؟',o:[['لأ، درجة كاملة',BIG('١٠/١٠','٣ كلمات رمادي')],['يخصم',BIG('٨/١٠','٣ كلمات رمادي')]],p:0,s:1,r:'لأ.'},
 {g:'التسميع',t:'رسالة «جرّب في مكان هادي»',q:'بعد كام كلمة رمادي؟',o:[['بعد ٥',BIG('٥+','')],['بعد ٣',BIG('٣+','')],['بعد ١',BIG('١+','')],['ما تظهرش',BIG('✕','')]],p:0,s:1,r:'بعد ٥ — ده المتطبق.'},
 {g:'التسميع',t:'صلّحها بنفسه',q:'غلط وصلّح قبل الشيخ؟',o:[['مش غلط',W([['يَسَّرْنَا','ok-w'],['صححتها بنفسك ✓','ok-w']])],['غلط',W([['يَسَّرْنَا','bad']])]],p:0,s:1,r:'مش غلط.'},
