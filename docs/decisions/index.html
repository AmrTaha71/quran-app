<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قرارات تربيطات آيات القرآن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, clear, for two partners reviewing decisions together on Monday.
   IDEA: a framed Mushaf-style booklet; each page is one decision with tick boxes.
   PICTURE: the decision card itself (choices as big tickable tiles), the first slide is the full table.
   COLOUR and TYPE: the app's Jasmine Night — deep purple, gold, cream; Cairo for text, Amiri for titles.
   LAYOUT: one decision per slide in a native side scroller; a sticky bar with prev/next and progress. */
:root{color-scheme:light;--bg:#FFFCF3;--ink:#24053B;--soft:#5E4A6D;--p:#3A065F;--p2:#4C0B7A;--g:#C9A227;--g2:#F0C85A;--card:#fff;--line:#E3DCE8}
:root[data-theme=dark]{color-scheme:dark;--bg:#1a0730;--ink:#F8F1DE;--soft:#C6B9CF;--card:#24053B;--line:#3C2D46}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Cairo,system-ui,sans-serif;overflow-x:clip}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px max(4vw,12px);background:var(--p);color:#F8F1DE;flex-wrap:wrap}
.bar h1{font:700 20px/1.2 Amiri,serif;margin:0;flex:1}
.bar button{min-height:44px;min-width:44px;padding:0 14px;border-radius:12px;border:1px solid var(--g2);background:transparent;color:var(--g2);font:600 15px Cairo;cursor:pointer}
.bar button:focus-visible,.opt:focus-within,textarea:focus-visible,.toc a:focus-visible{outline:3px solid var(--g2);outline-offset:2px}
.prog{height:4px;background:#ffffff22;flex-basis:100%;border-radius:4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--g2);transition:width .25s}
.deck{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none}
.deck::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;padding:clamp(16px,3vw,40px) max(4vw,14px) 40px}
.frame{max-width:860px;margin:0 auto;background:var(--card);border-radius:24px;padding:clamp(18px,3vw,36px);box-shadow:0 0 0 2px var(--g),0 0 0 7px var(--card),0 0 0 8px var(--g),0 14px 40px rgba(36,5,59,.15);position:relative}
.frame::before,.frame::after{content:"";position:absolute;width:18px;height:18px;background:var(--g2);clip-path:polygon(50% 0,64% 22%,90% 10%,78% 36%,100% 50%,78% 64%,90% 90%,64% 78%,50% 100%,36% 78%,10% 90%,22% 64%,0 50%,22% 36%,10% 10%,36% 22%);top:-9px;right:-9px}
.frame::after{right:auto;left:-9px}
.num{display:inline-block;background:var(--p);color:var(--g2);border-radius:999px;padding:2px 14px;font-weight:800;font-size:14px}
.tag{display:inline-block;border-radius:999px;padding:2px 12px;font-size:13px;font-weight:700;margin-inline-start:6px}
.done{background:#e7f6ec;color:#155d33}.open{background:#fff1d6;color:#7a4b00}
h2{font:700 clamp(26px,4vw,38px)/1.15 Amiri,serif;margin:10px 0 6px;color:var(--p);text-wrap:balance}
:root[data-theme=dark] h2{color:var(--g2)}
.q{font-size:18px;color:var(--soft);margin:0 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;background:var(--bg)}
.opt{font:inherit;color:inherit;text-align:start;width:100%}.n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--p);color:var(--g2);font-weight:800}
.go{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}.go label{font-weight:800}
select{min-height:48px;font:600 16px Cairo;border-radius:12px;border:2px solid var(--g);padding:0 10px;background:var(--bg);color:var(--ink);flex:1;min-width:180px}.ok{color:#155d33;font-weight:800}
.opt b{display:block;font-size:17px}.opt small{display:block;color:var(--soft);font-size:14px}
.opt.ours{border-color:var(--g)}
.pick{display:inline-block;background:var(--g2);color:#24053B;font-size:12px;font-weight:800;border-radius:8px;padding:0 8px;margin-inline-start:6px}
.opt.on{background:#f3eaff;border-color:var(--p2)}
:root[data-theme=dark] .opt.on{background:#3a1460}
.why{margin:14px 0 0;font-size:15px;color:var(--soft)}
label.note{display:block;margin-top:14px;font-weight:700}
textarea{width:100%;min-height:70px;margin-top:6px;border-radius:12px;border:1px solid var(--line);padding:10px;font:16px Cairo;background:var(--bg);color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{color:var(--soft);font-weight:600;font-size:13px}
.toc a{color:inherit;text-decoration:none;font-weight:700}
.big{font-size:18px}
.btn{min-height:48px;padding:0 22px;border-radius:14px;border:0;background:linear-gradient(#F0C85A,#C9A227);color:#24053B;font:800 17px Cairo;cursor:pointer}
pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;max-height:340px;overflow:auto;font:14px/1.6 Cairo}
.muted{color:var(--soft);font-size:14px}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:6em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:5.5em;margin-inline-start:-6em;color:var(--soft);font-size:12px}}
@media(prefers-reduced-motion:reduce){.deck{scroll-behavior:auto}.prog i{transition:none}}
</style>
</head>

 <span class="num">${ar(i+1)} من ${ar(D.length)} · ${esc(d.g)}</span><span class="tag ${d.s?'done':'open'}">${d.s?'متقرر':'محتاج قرار'}</span>
 <h2>${esc(d.t)}</h2><p class="q">${esc(d.q)}</p>
 <div class="opts">${d.o.map((o,j)=>`<button type="button" class="opt ${j===d.p?'ours':''} ${st[i]?.c===j?'on':''}" data-i="${i}" data-j="${j}"><span class="n">${ar(j+1)}</span><span><b>${esc(o[0])}${j===d.p?'<span class="pick">'+(d.s?'اخترناه':'اقتراح')+'</span>':''}</b>${o[1]?`<small>${esc(o[1])}</small>`:''}</span></button>`).join('')}</div>
 <label class="note" for="n${i}">ملاحظة (اختياري)</label><textarea id="n${i}" data-n="${i}" placeholder="مثلًا: موافقين بس نغيّر…">${esc(st[i]?.n||'')}</textarea>
 <div class="go"><label for="c${i}">اختيارنا:</label>
  <select id="c${i}" data-c="${i}"><option value="">— اختار —</option>${d.o.map((o,j)=>`<option value="${j}" ${st[i]?.c===j?'selected':''}>${ar(j+1)} — ${esc(o[0])}</option>`).join('')}</select>
  <button type="button" class="btn" data-ok="${i}">تم ✓</button><span class="ok" id="k${i}">${st[i]?.done?'اتسجّل ✓':''}</span></div>
</div></section>`).join('');
const end=`<section class="slide" id="s${D.length+1}"><div class="frame">
 <h2>النتيجة</h2><p class="q">دوس «انسخ النتيجة» والزقها في الشات مع كلود، وهو هيراجعها ويعدّل التطبيق.</p>
 <p><button class="btn" id="copy">انسخ النتيجة</button> <span id="cmsg" class="muted" aria-live="polite"></span></p>
 <pre id="out"></pre></div></section>`;
deck.innerHTML=cover+slides+end;
const all=[...deck.children], N=all.length;
const result=()=>'مراجعة قرارات التطبيق (عمرو ورنا):\n\n'+D.map((d,i)=>{const c=st[i]?.c;const has=typeof c==='number';const n=st[i]?.n?.trim();
 return `${i+1}. ${d.t}: ${has?(c+1)+' — '+d.o[c][0]+(c===d.p?' (موافقين)':' (تغيير)'):'— ما اتختارش —'}${n?'\n   ملاحظة: '+n:''}`}).join('\n');
const draw=()=>{document.getElementById('out').textContent=result()};
const pick=(i,j)=>{st[i]=st[i]||{n:''};st[i].c=j;st[i].done=false;save();draw();
 document.querySelectorAll(`.opt[data-i="${i}"]`).forEach(b=>b.classList.toggle('on',+b.dataset.j===j));
 document.getElementById('c'+i).value=j==null?'':j;document.getElementById('k'+i).textContent=''};
deck.addEventListener('change',e=>{const x=e.target;if(x.dataset.c==null)return;pick(+x.dataset.c,x.value===''?null:+x.value)});
deck.addEventListener('input',e=>{const x=e.target;if(x.dataset.n==null)return;const i=+x.dataset.n;st[i]=st[i]||{n:''};st[i].n=x.value;save();draw()});
let cur=0;
const go=k=>{cur=Math.max(0,Math.min(N-1,k));all[cur].scrollIntoView({block:'nearest',inline:'start'});window.scrollTo({top:0})};
deck.addEventListener('click',e=>{const a=e.target.closest('[data-go]');if(a){e.preventDefault();go(+a.dataset.go);return}
 const o=e.target.closest('.opt[data-i]');if(o){pick(+o.dataset.i,+o.dataset.j);return}
 const k=e.target.closest('[data-ok]');if(k){const i=+k.dataset.ok,m=document.getElementById('k'+i);
  if(typeof st[i]?.c!=='number'){m.textContent='اختار رقم الأول';return}
  st[i].done=true;save();draw();m.textContent='اتسجّل ✓';setTimeout(()=>go(i+2),350)}});
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA')return;if(e.key==='ArrowLeft')go(cur+1);if(e.key==='ArrowRight')go(cur-1)});
const io=new IntersectionObserver(es=>{for(const x of es)if(x.isIntersecting&&x.intersectionRatio>.6){cur=all.indexOf(x.target);
 document.getElementById('pos').textContent=cur===0?'الفهرس':cur===N-1?'النتيجة':`${ar(cur)} / ${ar(D.length)}`;
 document.getElementById('pg').style.width=(cur/(N-1)*100)+'%'}},{root:deck,threshold:[.6]});
all.forEach(s=>io.observe(s));
document.getElementById('copy').onclick=async()=>{const m=document.getElementById('cmsg');try{await navigator.clipboard.writeText(result());m.textContent='اتنسخ ✓'}catch(e){m.textContent='النسخ مش متاح هنا — علّم على النص اللي تحت وانسخه بإيدك'}};
draw();
}
</script>
</body>
</html>
