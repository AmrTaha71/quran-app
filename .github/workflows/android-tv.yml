name: Build Android TV app
on:
  workflow_dispatch:
  push:
    paths: ['tv-apps/androidtv/**', '.github/workflows/android-tv.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: tv-apps/androidtv } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle assembleDebug bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: rawabit-androidtv
          path: |
            tv-apps/androidtv/app/build/outputs/apk/debug/*.apk
            tv-apps/androidtv/app/build/outputs/bundle/release/*.aab
