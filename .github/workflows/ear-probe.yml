name: ear-probe
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q huggingface_hub pyarrow
      - name: probe datasets
        run: |
          python3 - <<'PY'
          import json, os, signal
          from huggingface_hub import HfApi, list_repo_files, hf_hub_download
          import pyarrow.parquet as pq
          api = HfApi(); out = {'search': {}}
          def to(sec):
              def h(*a): raise TimeoutError()
              signal.signal(signal.SIGALRM, h); signal.alarm(sec)
          names = set()
          for q in ['quran','tajweed','mispronunciation','iqra','recitation']:
              try:
                  to(40)
                  for d in api.list_datasets(search=q, limit=60): names.add(d.id)
              except BaseException as e: out['search'][q] = repr(e)[:100]
              finally: signal.alarm(0)
          try:
              to(40)
              for d in api.list_datasets(author='IqraEval', limit=60): names.add(d.id)
          except BaseException as e: out['search']['author'] = repr(e)[:100]
          finally: signal.alarm(0)
          out['all_names'] = sorted(names)
          for repo in ['IqraEval/Iqra_Extra_IS26','IqraEval/QuranMB.v2','IqraEval/open_testset','RetaSy/quranic_audio_dataset']:
              r = {}
              try:
                  to(90)
                  files = list_repo_files(repo, repo_type='dataset'); r['files'] = files[:40]; r['nfiles'] = len(files)
                  pq_files = [f for f in files if f.endswith('.parquet')]
                  if 'README.md' in files:
                      r['readme'] = open(hf_hub_download(repo, 'README.md', repo_type='dataset')).read()[:3000]
                  if pq_files:
                      pth = hf_hub_download(repo, pq_files[0], repo_type='dataset')
                      pf = pq.ParquetFile(pth); r['schema'] = str(pf.schema_arrow)[:1500]; r['rows_first_file'] = pf.metadata.num_rows
                      cols = [c for c in pf.schema_arrow.names if c != 'audio']
                      row = next(pf.iter_batches(batch_size=3, columns=cols)).to_pylist()
                      r['sample'] = [{k: str(v)[:250] for k, v in x.items()} for x in row]
              except BaseException as e: r['err'] = repr(e)[:300]
              finally: signal.alarm(0)
              out[repo] = r
          json.dump(out, open('/tmp/probe.json', 'w'), ensure_ascii=False, indent=1)
          PY
      - name: push probe to ear-results
        run: |
          git config user.name ear-eval; git config user.email ear-eval@users.noreply.github.com
          git fetch origin ear-results; git checkout -B ear-results origin/ear-results
          mkdir -p probe; cp /tmp/probe.json probe/probe.json; git add probe; git commit -m "probe datasets" || true; git push origin ear-results
