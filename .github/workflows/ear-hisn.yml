name: ear-hisn
on:
  workflow_dispatch:
    inputs:
      src: { description: 'all | sobolev | qlab', required: false, default: 'all' }
      limit: { description: 'max clips (0 = all)', required: false, default: '0' }
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu torch onnxruntime soundfile numpy huggingface_hub pyarrow quran-transcript librosa faster-whisper
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: SRC="${{ inputs.src }}" QL_LIMIT=300 python3 tools/ear-eval/real_fetch.py /tmp/real
        timeout-minutes: 40
      - name: run model
        run: LIMIT="${{ inputs.limit }}" python3 tools/ear-eval/hisn_eval.py /tmp/real/manifest.jsonl /tmp/hisn 2>&1 | tee /tmp/hisn.log
      - name: summaries
        run: for k in a b c; do python3 tools/ear-eval/summarize_real.py /tmp/hisn-$k.jsonl /tmp/hisn-sum-$k.json > /dev/null; done; cat /tmp/hisn-sum-a.json | head -60
      - name: push
        run: |
          git config user.name ear-eval; git config user.email ear-eval@users.noreply.github.com
          git fetch origin ear-results; git checkout -B ear-results origin/ear-results
          mkdir -p hisn; cp /tmp/hisn-sum-*.json hisn/; cp /tmp/hisn.log hisn/run.log
          git add hisn; git commit -m "ear-hisn" || true
          git push origin ear-results
