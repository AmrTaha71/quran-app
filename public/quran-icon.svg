<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- روابط الذكر الحكيم — app emblem (favicon). Matches the richer
       PWA icon drawn by scripts/generate-icons.mjs: radial emerald,
       gold frame, medallion rings with dots, filled 8-point star,
       gold-bound open Mushaf, name in gold below. -->
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0b7a5e"/>
      <stop offset="100%" stop-color="#04543c"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#g)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#f0c85a" stroke-width="16"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="#f0c85a" stroke-width="12"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="#f0c85a" stroke-width="7"/>
  <g fill="#f0c85a">
    <circle cx="467" cy="256" r="9"/><circle cx="439" cy="362" r="9"/><circle cx="362" cy="439" r="9"/>
    <circle cx="256" cy="467" r="9"/><circle cx="150" cy="439" r="9"/><circle cx="73" cy="362" r="9"/>
    <circle cx="45" cy="256" r="9"/><circle cx="73" cy="150" r="9"/><circle cx="150" cy="73" r="9"/>
    <circle cx="256" cy="45" r="9"/><circle cx="362" cy="73" r="9"/><circle cx="439" cy="150" r="9"/>
  </g>
  <!-- Filled 8-point star: square + larger diamond -->
  <g fill="#f0c85a">
    <rect x="202" y="94" width="108" height="108"/>
    <rect x="202" y="94" width="108" height="108" transform="rotate(45 256 148)"/>
  </g>
  <!-- Open Mushaf: solid gold binding, cream pages inset -->
  <path d="M256 262 L120 232 L120 356 L256 384 Z" fill="#f0c85a" stroke="#f0c85a" stroke-width="6" stroke-linejoin="round"/>
  <path d="M256 262 L392 232 L392 356 L256 384 Z" fill="#f0c85a" stroke="#f0c85a" stroke-width="6" stroke-linejoin="round"/>
  <path d="M256 276 L138 246 L138 342 L256 370 Z" fill="#f8f1de"/>
  <path d="M256 276 L374 246 L374 342 L256 370 Z" fill="#f8f1de"/>
  <line x1="256" y1="262" x2="256" y2="384" stroke="#f0c85a" stroke-width="12"/>
  <text x="256" y="456" text-anchor="middle" font-size="44" fill="#f0c85a" font-family="serif">روابط الذكر الحكيم</text>
</svg>
