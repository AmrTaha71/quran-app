<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#065f46" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- interactive-widget=resizes-content: the on-screen keyboard resizes
         the layout viewport (Android) instead of covering fixed inputs. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Fonts: preconnect + preload-as-style (Amiri added as the Naskh
         fallback; no binary font files are bundled — text-only push). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" /></noscript>
    <title>روابط الذكر الحكيم — احفظ القرآن بالتربيطات</title>
    <meta name="description" content="احفظ القرآن الكريم بالتربيطات الذهنية، آية آية — كل آية مربوطة بما قبلها وما بعدها عشان تثبت في ذهنك." />
    <!-- Share card: the app's own mark (public/icon-512.png, also the
         home-page mark), NOT a generic default — Claude noted a
         shared link showed a generic image instead of the app's
         identity (2026-10-29). Absolute URL: crawlers need one. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="روابط الذكر الحكيم — احفظ القرآن بالتربيطات" />
    <meta property="og:description" content="احفظ القرآن الكريم بالتربيطات الذهنية، آية آية — كل آية مربوطة بما قبلها وما بعدها عشان تثبت في ذهنك." />
    <meta property="og:image" content="https://rawabit-alziker-alhakim.vercel.app/icon-512.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://rawabit-alziker-alhakim.vercel.app/icon-512.png">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
